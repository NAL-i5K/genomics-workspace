###########################################################
# Define Upstream servers, moved from php-fpm.conf
# as per ISD: VDC: 10-05-2020
###########################################################
#upstream php-fpm {
#        server unix:/run/php-fpm/www.sock;
#}

upstream production {
        server unix:APP_HOME/run/production.sock;
}

upstream training {
        server unix:APP_HOME/run/training.sock;
}

server {

    listen 8000;


    #access_log  APP_HOME/logs/i5k_big_access.log  bigip;
    #access_log  APP_HOME//logs/i5k_main_access.log  main;

    set $realaddr "";
    if ($http_x_forwarded_for ~ "(\d+\.\d+\.\d+\.\d+)$") {
        set $realaddr $1;
    }

    #root /app/web/drupal7;
    #root /app/i5k-tripal/wwwroot;


    ####################################################
    # Security Scan Mitigation Efforts VDC: 08-27-2020
    ###################################################
    #proxy_cookie_path / "/; HTTPOnly; Secure";
    ####################################################
    # Mitigate CORS errors VDC: 08-31-2020
    ####################################################
    #add_header Access-Control-Allow-Origin *.nal.usda.gov;
    # Limit X-Frame-Options to SAMEORIGIN
    #add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Frame-Options SAMEORIGIN always;
    # Set Content Security Policy
    add_header Content-Security-Policy "default-src 'self' *.googleapis.com; frame-src *.nal.usda.gov ;  img-src 'self' jbrowse.org *.ssa.gov *.gstatic.com *.google.com  *.googleapis.com *.google-analytics.com data: badges.altmetric.com orcid.org *.usda.gov *.arcgisonline.com *.cloudfront.net; font-src 'self' data: *.cloudfront.net *.gstatic.com; style-src 'self' 'unsafe-inline' *.ssa.gov *.nal.usda.gov  www.google.com *.cloudfront.net *.googleapis.com; script-src 'unsafe-inline' 'unsafe-eval' 'self' *.ssa.gov cdn.rawgit.com cdnjs.cloudflare.com use.fontawesome.com *.googleapis.com *.google.com api.altmetric.com dap.digitalgov.gov *.google-analytics.com https://*.googletagmanager.com ajax.googleapis.com cdn.plu.mx *.cloudfront.net; connect-src 'self' api.plu.mx https://*.google.com *.google-analytics.com;";
    
    # Remove Generators Headers
    add_header X-Drupal-Cache "";
    add_header X-Generator "";

    server_name_in_redirect on;

    ######################################################
    # Added location to block potentially sensitive areas
    # as directed by ISD VDC - 09-29-2020
    ######################################################
    location ~ ^/(src|login|authenticate|config) {
        rewrite ^.*$ /errors/404 break;
    }

    ######################################################
    # Added proxy to apollo so that the gene pages
    # can load the apollo page in an iframe 
    # VDC - 09-29-2020
    ######################################################
    #location ^~ /apollo2_redirect/ {
    #    #proxy_pass https://apollo2-dev.nal.usda.gov/apollo/;
    #    #proxy_pass http://apollo2-node1.nal.usda.gov/apollo/;
    #    proxy_pass https://apollo-stage.nal.usda.gov/apollo/;
    #    proxy_redirect default;
    #    proxy_read_timeout 600s;
    #}
   

    ####################################################
    # Expose the data directory and allow users to
    # download the fasta files - VDC 08-13-2020
    ####################################################
    #location ~* /data/(.*) {
    #  alias /app/web/drupal7/data/$1;
    #  autoindex on;
    #  autoindex_format html;
    #}

    ####################################################
    # Serve all static files from the same instance of
    # the i5k workspace application - VDC 08-13-2020
    ####################################################
    location ~* ^/static/(.*)  {
      alias APP_HOME/production/static/$1;
    }

    ####################################################
    # Serve all static files from the same instance of
    # the i5k-training application - VDC 08-13-2020
    ####################################################        
    location ~* ^/training/webapp/(static|media)/(.*)  {
      alias APP_HOME/production/$1/$2;
      autoindex off;
      autoindex_format html;
    }

    ########################################################
    # Pass request to i5k-training instance - VDC 08-13-2020
    ########################################################
    location ~* ^/training/webapp/(.*)  {
        include uwsgi_params;
        uwsgi_pass training;
        uwsgi_param SCRIPT_NAME /training/webapp;
    }


    ##########################################################################
    # Serve static files from the i5k production instance - VDC 08-13-2020
    ##########################################################################
    location ~* ^/webapp/(static|media)/(.*)  {
      alias APP_HOME/production/$1/$2;
      autoindex off;
      autoindex_format html;
    }


    ##############################################################
    # Pass request to the production i5k instance - VDC 08-13-2020
    ##############################################################
    location ~* ^/webapp/(.*)  {
        include uwsgi_params;
        uwsgi_pass production;
        uwsgi_param SCRIPT_NAME /webapp;
    }


    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Very rarely should these ever be accessed outside of your lan
    location ~* \.(txt|log)$ {
        #allow <internal lan ips>;
        allow 10.11.1.0/24;
        allow 10.12.1.0/24;
        allow 199.133.240.0/24;
        allow 199.133.7.0/24;
        allow 10.4.58.0/24;
        allow 10.4.101.0/24;
        allow 10.4.228.0/24;
        allow 10.177.1.0/24;
        allow 10.4.201.0/24;
        deny all;
    }

    location ~ \..*/.*\.php$ {
        return 403;
    }

    location ~ ^/sites/.*/private/ {
        return 403;
    }

    # Block access to scripts in site files directory
    location ~ ^/sites/[^/]+/files/.*\.php$ {
        deny all;
    }

    # Allow "Well-Known URIs" as per RFC 5785
    location ~* ^/.well-known/ {
        allow all;
    }

    # Block access to "hidden" files and directories whose names begin with a
    # period. This includes directories used by version control systems such
    # as Subversion or Git to store control files.
    location ~ (^|/)\. {
        return 403;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }

    # Don't allow direct access to PHP files in the vendor directory.
    location ~ /vendor/.*\.php$ {
        deny all;
        return 404;
    }

    # fix for github isdapps/IT_Security ticket #41  VDC 05-02-2022
    location /web.config {
        deny all;
        return 404;
    }


    # Protect files and directories from prying eyes.
    location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$|^(\.(?!well-known).*|Entries.*|Repository|Root|Tag|Template|composer\.(json|lock)|web\.config)$|^#.*#$|\.php(~|\.sw[op]|\.bak|\.orig|\.save)$ {
        deny all;
        return 404;
    }

    # In Drupal 8, we must also match new paths where the '.php' appears in
    # the middle, such as update.php/selection. The rule we use is strict,
    # and only allows this pattern with the update.php front controller.
    # This allows legacy path aliases in the form of
    # blog/index.php/legacy-path to continue to route to Drupal nodes. If
    # you do not have any paths like that, then you might prefer to use a
    # laxer rule, such as:
    #   location ~ \.php(/|$) {
    # The laxer rule will continue to work if Drupal uses this new URL
    # pattern with front controllers other than update.php in a future
    # release.
    #location ~ '\.php$|^/update.php' {
    #    fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        # Ensure the php file exists. Mitigates CVE-2019-11043
    #    try_files $fastcgi_script_name =404;
        # Security note: If you're running a version of PHP older than the
        # latest 5.3, you should have "cgi.fix_pathinfo = 0;" in php.ini.
        # See http://serverfault.com/q/627903/94922 for details.
    #    include fastcgi_params;
        # Block httpoxy attacks. See https://httpoxy.org/.
    #    fastcgi_param HTTP_PROXY "";
    #    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    #    fastcgi_param PATH_INFO $fastcgi_path_info;
    #    fastcgi_param QUERY_STRING $query_string;
    #    fastcgi_intercept_errors on;
	#fastcgi_pass_header 'VERN: GOING CRAZY';
        # fastcgi_index index.php;
        #fastcgi_pass php-fpm;
    #}

    # Fighting with Styles? This little gem is amazing.
    location ~ ^/sites/.*/files/styles/ {
        try_files $uri @rewrite;
    }

    # Handle private files through Drupal. Private file's path can come
    # with a language prefix.
    location ~ ^(/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        try_files $uri @rewrite;
        expires max;
        log_not_found off;
    }

    # Enforce clean URLs
    # Removes index.php from urls like www.example.com/index.php/my-page --> www.example.com/my-page
    # Could be done with 301 for permanent or other redirect codes.
    if ($request_uri ~* "^(.*/)index\.php/(.*)") {
        return 307 $1$2;
    }
}

