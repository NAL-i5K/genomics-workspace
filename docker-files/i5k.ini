[uwsgi]
project = i5k
uid = APP_USER
base = APP_HOME
route-run = fixpathinfo:

chdir = %(base)
module = i5k.wsgi:application

master = true
processes = 10
threads = 2

socket = APP_DIR/run/APP_ID.sock
chown-socket = APP_USER:APP_USER
chmod-socket = 660
vacuum = true

logger  = file:APP_DIR/logs/APP_ID.log
buffer-size = 65535
harakiri = 60
