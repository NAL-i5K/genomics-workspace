[tool.poetry]
name = "genomics-workspace"
version = "0.2.2"
description = "I5K Genomics Workspace"
authors = ["Vernon Chapman <vernon.chapman@usda.gov>"]
license = "Apache"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.7"
psycopg2-binary = "2.9.9"
amqp = "2.5.2"
billiard = "3.6.1.0"
celery = "4.3.0"
certifi = "2019.11.28"
chardet = "3.0.4"
coreapi = "2.3.3"
coreschema = "0.0.4"
cssmin = "0.2.0"
django = "2.2.14"
django-appconf = "1.0.3"
django-axes = "5.0.20"
django-ipware = "2.1.0"
django-pipeline = "1.6.14"
djangorestframework = "3.10.3"
django-rest-swagger = "2.2.0"
django-suit = "0.2.28"
docutils = "0.15.2"
idna = "2.7"
importlib-metadata = "1.2.0"
itypes = "1.1.0"
jinja2 = "2.10.3"
jsmin = "3.0.0"
kombu = "4.6.6"
markdown = "3.1.1"
markupsafe = "1.1.1"
modernize = "0.7"
more-itertools = "8.0.0"
openapi-codec = "1.3.2"
